<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | FarmDirect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <div class="nav-container">
            <a href="consumer.html" class="logo">🌾 FarmDirect</a>
            <nav class="nav-links">
                <a href="consumer.html">Marketplace</a>
                <button class="cart-btn" onclick="window.location.href='cart.html'">🛒 Cart</button>
            </nav>
        </div>
    </header>

    <main class="cart-page-container">
        <h2>Shopping Cart</h2>

        <div class="cart-layout">
            <!-- Left Side: Cart Items List -->
            <div class="cart-items-section" id="cartItemsList">
                <p>Loading cart items...</p>
            </div>

            <!-- Right Side: Summary Box & Payment -->
            <div class="card" id="summaryCard" style="height: fit-content;">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>₹<span id="subTotal">0</span></span>
                </div>
                <div class="summary-row">
                    <span>Delivery Fee</span>
                    <span style="color: var(--primary-light); font-weight: bold;">FREE</span>
                </div>
                <hr class="divider">
                <div class="summary-row total-row">
                    <span>Total</span>
                    <span>₹<span id="grandTotal">0</span></span>
                </div>

                <div class="payment-section">
                    <h4 style="margin-bottom: 0.5rem;">Select Payment Method</h4>
                    <div class="payment-options">
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="upi" checked>
                            <span>UPI / QR Code</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="cod">
                            <span>Cash on Delivery (COD)</span>
                        </label>
                    </div>

                    <button class="btn-submit" onclick="processOrder()" style="width: 100%; margin-top: 1.2rem; cursor: pointer;">
                        Place Direct Order
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 FarmDirect. Empowering Agriculture with Direct Peer-to-Peer Trading.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", renderCartPage);

        function renderCartPage() {
            const cart = JSON.parse(localStorage.getItem('farmCart')) || [];
            const cartItemsList = document.getElementById("cartItemsList");
            const summaryCard = document.getElementById("summaryCard");

            if (cart.length === 0) {
                cartItemsList.innerHTML = `<div style="text-align: center; padding: 2rem;">
                    <h3>Your Cart is Currently Empty 🛒</h3>
                    <p style="margin-top: 10px;"><a href="consumer.html" style="color: var(--primary); font-weight: bold;">Click here</a> to explore available produce.</p>
                </div>`;
                if(summaryCard) summaryCard.style.display = "none";
                return;
            }

            if(summaryCard) summaryCard.style.display = "block";

            let html = "";
            let total = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * (item.quantity || 1);
                total += itemTotal;

                html += `
                    <div class="cart-item-card">
                        <img src="${item.image || 'https://images.unsplash.com/photo-1542838132-92c53300491e'}" class="cart-item-img" alt="${item.title}">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.title}</div>
                            <div class="cart-item-price">₹${item.price} × ${item.quantity || 1}</div>
                        </div>
                        <div class="cart-qty-controls">
                            <strong style="margin-right: 10px; color: var(--primary);">₹${itemTotal}</strong>
                            <button class="btn-remove" onclick="removeItem(${index})">Remove</button>
                        </div>
                    </div>
                `;
            });

            cartItemsList.innerHTML = html;
            document.getElementById("subTotal").innerText = total;
            document.getElementById("grandTotal").innerText = total;
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('farmCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('farmCart', JSON.stringify(cart));
            renderCartPage();
        }

        function processOrder() {
            const method = document.querySelector('input[name="paymentMethod"]:checked')?.value || 'upi';
            alert(`Order Placed Successfully via ${method.toUpperCase()}! Thank you for supporting direct farming.`);
            localStorage.removeItem('farmCart');
            window.location.href = 'consumer.html';
        }
    </script>
</body>
</html>
