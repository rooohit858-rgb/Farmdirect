<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Authentication | FarmDirect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-body">

    <div class="auth-card-3d" id="auth3dCard">
        <div class="auth-header">
            <a href="index.html" class="auth-logo">🌾 FarmDirect</a>
            <p>Access your agricultural trade account</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTabBtn" onclick="switchAuthTab('login')">Log In</button>
            <button class="auth-tab" id="signupTabBtn" onclick="switchAuthTab('signup')">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="farmer@agri.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Log In to Account</button>
        </form>

        <!-- Sign Up Form -->
        <form id="signupForm" class="auth-form hidden">
            <div class="form-group">
                <label>Full Name / Business Name</label>
                <input type="text" id="signupName" class="form-control" placeholder="Green Valley Organic Farm" required>
            </div>
            <div class="form-group">
                <label>Primary Phone Number</label>
                <input type="tel" id="signupPhone" class="form-control" placeholder="+91 98765 43210" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" class="form-control" placeholder="farmer@agri.com" required>
            </div>
            <div class="form-group">
                <label>Create Password</label>
                <input type="password" id="signupPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Select Role</label>
                <select id="userRole" class="form-control" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; background: #fff;">
                    <option value="consumer">Consumer / Buyer</option>
                    <option value="farmer">Farmer / Seller</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Register Account</button>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginBtn.classList.add('active');
                signupBtn.classList.remove('active');
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                signupBtn.classList.add('active');
                loginBtn.classList.remove('active');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            if (mode === 'signup') {
                switchAuthTab('signup');
            }
            
            const roleParam = urlParams.get('role');
            if (roleParam) {
                const roleSelect = document.getElementById('userRole');
                if (roleSelect) {
                    roleSelect.value = roleParam.toLowerCase();
                }
            }
        });

        // Handle Login Submission
        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    localStorage.setItem('userRole', data.user.role);
                    localStorage.setItem('userName', data.user.name);
                    localStorage.setItem('userEmail', data.user.email);

                    alert('Login Successful!');
                    
                    const role = (data.user.role || '').toLowerCase();
                    if (role === 'farmer') {
                        window.location.replace('dashboard.html');
                    } else {
                        window.location.replace('consumer.html');
                    }
                } else {
                    alert('Login Failed: ' + (data.detail || data.message || 'Invalid credentials'));
                }
            } catch (err) {
                console.error('Login Error:', err);
                alert('Server se connect nahi ho pa raha!');
            }
        }

        // Handle Signup Submission
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nameEl = document.getElementById('signupName') || document.querySelector('#signupForm input[type="text"]');
            const emailEl = document.getElementById('signupEmail') || document.querySelector('#signupForm input[type="email"]');
            const passEl = document.getElementById('signupPassword') || document.querySelector('#signupForm input[type="password"]');
            const roleEl = document.getElementById('userRole') || document.querySelector('#signupForm select');

            const payload = {
                name: nameEl ? nameEl.value.trim() : "Farmer User",
                email: emailEl ? emailEl.value.trim() : "",
                password: passEl ? passEl.value : "",
                role: roleEl ? roleEl.value.trim() : "farmer"
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    localStorage.setItem('userRole', payload.role);
                    localStorage.setItem('userName', payload.name);
                    localStorage.setItem('userEmail', payload.email);

                    alert('Registration Successful! Name: ' + payload.name);

                    const role = payload.role.toLowerCase();
                    if (role === 'farmer') {
                        window.location.replace('dashboard.html');
                    } else {
                        window.location.replace('consumer.html');
                    }
                } else {
                    alert('Registration Failed: ' + (data.message || 'Koyi error aayi hai'));
                }
            } catch (err) {
                console.error('Fetch Error:', err);
                alert('Server se connect nahi ho pa raha!');
            }
        });
    </script>
</body>
</html>
