<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | FarmDirect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-body">

    <div class="auth-card-3d" id="auth3dCard">
        <div class="auth-header">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <a href="home.html" class="auth-logo">🌾 FarmDirect</a>
                <div class="lang-selector-container" style="background: #e8f5e9; border: 1px solid #c8e6c9;">
                    <span class="lang-globe-icon">🌐</span>
                    <select class="lang-selector" onchange="changeLanguage(this.value)" aria-label="Select Language" style="color: #1b4332;">
                        <option value="en">English</option>
                        <option value="hi">हिंदी (Hindi)</option>
                        <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                        <option value="mr">मराठी (Marathi)</option>
                    </select>
                </div>
            </div>
            <p>Access your agricultural trade account</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTabBtn" onclick="switchAuthTab('login')" data-i18n="login">Log In</button>
            <button class="auth-tab" id="signupTabBtn" onclick="switchAuthTab('signup')" data-i18n="register">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
                <label data-i18n="emailAddress">Email Address</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="user@farmdirect.com" required>
            </div>
            <div class="form-group">
                <label data-i18n="password">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit" data-i18n="loginToAccount">Log In to Account</button>
        </form>

        <!-- Sign Up Form -->
        <form id="signupForm" class="auth-form hidden">
            <div class="form-group">
                <label>Full Name / Business Name</label>
                <input type="text" id="signupName" class="form-control" placeholder="Green Valley Organic Farm" required>
            </div>
            <div class="form-group">
                <label>Primary Phone Number</label>
                <input type="tel" id="signupPhone" class="form-control" placeholder="+91 98765 43210" required>
            </div>
            <div class="form-group">
                <label>Farm Location / District, State</label>
                <input type="text" id="signupLocation" class="form-control" placeholder="e.g. Ludhiana, Punjab or Nashik, Maharashtra" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" class="form-control" placeholder="user@farmdirect.com" required>
            </div>
            <div class="form-group">
                <label>Create Password</label>
                <input type="password" id="signupPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Select Role</label>
                <select id="userRole" class="form-control" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; background: #fff;">
                    <option value="consumer">Consumer / Buyer</option>
                    <option value="farmer">Farmer / Seller</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Register Account</button>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginBtn.classList.add('active');
                signupBtn.classList.remove('active');
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                signupBtn.classList.add('active');
                loginBtn.classList.remove('active');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            if (mode === 'signup') {
                switchAuthTab('signup');
            }
            
            const roleParam = urlParams.get('role');
            if (roleParam) {
                const roleSelect = document.getElementById('userRole');
                if (roleSelect) {
                    roleSelect.value = roleParam.toLowerCase();
                }
            }
        });

        // Handle Login Submission
        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    const u = data.user || {};
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userRole', u.role || 'consumer');
                    localStorage.setItem('userName', u.name || email.split('@')[0]);
                    localStorage.setItem('userEmail', u.email || email);
                    localStorage.setItem('userPhone', u.phone || '');
                    localStorage.setItem('userLocation', u.location || '');
                    localStorage.setItem('userCreatedAt', u.created_at || '');

                    alert('Login Successful! Welcome, ' + (u.name || 'User'));
                    
                    const role = (u.role || '').toLowerCase();
                    if (role === 'farmer') {
                        window.location.replace('dashboard.html');
                    } else {
                        window.location.replace('consumer.html');
                    }
                } else {
                    alert('Login Failed: ' + (data.detail || data.message || 'Invalid credentials'));
                }
            } catch (err) {
                console.error('Login Error:', err);
                // Offline fallback login for seamless testing
                const roleParam = new URLSearchParams(window.location.search).get('role') || 'consumer';
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', roleParam);
                localStorage.setItem('userName', email.split('@')[0] || 'User');
                localStorage.setItem('userEmail', email);
                alert('Offline Mode: Logged in as ' + roleParam.toUpperCase());
                window.location.replace(roleParam === 'farmer' ? 'dashboard.html' : 'consumer.html');
            }
        }

        // Handle Signup Submission
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nameEl = document.getElementById('signupName');
            const emailEl = document.getElementById('signupEmail');
            const passEl = document.getElementById('signupPassword');
            const phoneEl = document.getElementById('signupPhone');
            const locationEl = document.getElementById('signupLocation');
            const roleEl = document.getElementById('userRole');

            const payload = {
                name: nameEl ? nameEl.value.trim() : "FarmDirect User",
                email: emailEl ? emailEl.value.trim() : "",
                password: passEl ? passEl.value : "",
                role: roleEl ? roleEl.value.trim().toLowerCase() : "consumer",
                phone: phoneEl ? phoneEl.value.trim() : "+91 98765 43210",
                location: locationEl ? locationEl.value.trim() : "Ludhiana, Punjab"
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    const u = data.user || payload;
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userRole', u.role || payload.role);
                    localStorage.setItem('userName', u.name || payload.name);
                    localStorage.setItem('userEmail', u.email || payload.email);
                    localStorage.setItem('userPhone', u.phone || payload.phone || '');
                    localStorage.setItem('userLocation', u.location || payload.location || '');
                    if (u.created_at) localStorage.setItem('userCreatedAt', u.created_at);

                    alert('Registration Successful! Welcome, ' + (u.name || payload.name));

                    const role = (u.role || payload.role).toLowerCase();
                    if (role === 'farmer') {
                        window.location.replace('dashboard.html');
                    } else {
                        window.location.replace('consumer.html');
                    }
                } else {
                    alert('Registration Failed: ' + (data.message || 'Error occurred'));
                }
            } catch (err) {
                console.error('Fetch Error:', err);
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', payload.role);
                localStorage.setItem('userName', payload.name);
                localStorage.setItem('userEmail', payload.email);
                localStorage.setItem('userPhone', payload.phone);
                localStorage.setItem('userLocation', payload.location);
                alert('Offline Mode: Registered as ' + payload.role.toUpperCase());
                window.location.replace(payload.role === 'farmer' ? 'dashboard.html' : 'consumer.html');
            }
        });
    </script>
</body>
</html>
