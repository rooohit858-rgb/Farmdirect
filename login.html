<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Authentication | FarmDirect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-body">

    <div class="auth-card-3d" id="auth3dCard">
        <div class="auth-header">
            <a href="index.html" class="auth-logo">🌾 FarmDirect</a>
            <p>Access your agricultural trade account</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTabBtn" onclick="switchAuthTab('login')">Log In</button>
            <button class="auth-tab" id="signupTabBtn" onclick="switchAuthTab('signup')">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form" onsubmit="handleAuthSubmit(event, 'Login')">
            <div class="form-group">
                <label>Email or Mobile Number</label>
                <input type="text" class="form-control" placeholder="farmer@agri.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Log In to Account</button>
        </form>

        <!-- Sign Up Form -->
       <form id="signupForm" class="auth-form hidden">
            <div class="form-group">
                <label>Full Name / Business Name</label>
                <input type="text" class="form-control" placeholder="Green Valley Organic Farm" required>
            </div>
            <div class="form-group">
                <label>Primary Phone Number</label>
                <input type="tel" class="form-control" placeholder="+91 98765 43210" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" class="form-control" placeholder="farmer@agri.com" required>
            </div>
            <div class="form-group">
                <label>Create Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-group">
    <label>Select Role</label>
    <select id="userRole" class="form-control" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; background: #fff;">
        <option value="consumer">Consumer / Buyer</option>
        <option value="farmer">Farmer / Seller</option>
    </select>
</div>
            <button type="submit" class="btn-submit">Register Farmer Account</button>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            if (mode === 'signup') {
                switchAuthTab('signup');
            }
        });
    </script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const roleParam = urlParams.get('role');
        if (roleParam) {
            const roleSelect = document.querySelector('select');
            if (roleSelect) {
                roleSelect.value = roleParam.charAt(0).toUpperCase() + roleParam.slice(1);
            }
        }
    });  
document.addEventListener('DOMContentLoaded', () => {
    const signupForm = document.querySelector('#signupForm');
    if (signupForm) {
        signupForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const nameInput = signupForm.querySelector('input[type="text"]') || signupForm.querySelector('input');
            const emailInput = signupForm.querySelector('input[type="email"]');
            const passwordInput = signupForm.querySelector('input[type="password"]');
            const roleSelect = signupForm.querySelector('select');
            
            const payload = {
                name: nameInput ? nameInput.value : 'Farmer User',
                email: emailInput ? emailInput.value : 'farmer@agri.com',
                password: passwordInput ? passwordInput.value : '123456',
                role: roleSelect ? roleSelect.value : 'Farmer'
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    localStorage.setItem('userRole', payload.role);
                    localStorage.setItem('userName', payload.name);
                    localStorage.setItem('userEmail', payload.email);

                    alert('Registration Successful! Role: ' + payload.role);

                    const cleanRole = payload.role.toLowerCase().trim();
                    if (cleanRole === 'farmer' || cleanRole.includes('farmer')) {
                        window.location.replace('index.html');
                    } else {
                        window.location.replace('consumer.html');
                    }
                } else {
                    alert('Registration Failed: ' + (data.message || 'Koyi error aayi hai'));
                }
            } catch (err) {
                console.error('Fetch Error:', err);
                alert('Server se connect nahi ho pa raha!');
            }
        });
    }
});
    

</script>
</body>
</html>
