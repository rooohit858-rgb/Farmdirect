<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | FarmDirect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="consumer.html" class="logo">🌾 FarmDirect</a>
            <nav class="nav-links">
                <a href="consumer.html" data-i18n="marketplace">Back to Marketplace</a>
                <a href="orders.html" data-i18n="myOrders">My Orders</a>

                <!-- Multi-Language Selector -->
                <div class="lang-selector-container">
                    <span class="lang-globe-icon">🌐</span>
                    <select class="lang-selector" onchange="changeLanguage(this.value)" aria-label="Select Language">
                        <option value="en">English</option>
                        <option value="hi">हिंदी (Hindi)</option>
                        <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                        <option value="mr">मराठी (Marathi)</option>
                    </select>
                </div>

                <button class="cart-btn" onclick="window.location.href='cart.html'">🛒 Cart (<span id="cart-count">0</span>)</button>
            </nav>
        </div>
    </header>

    <div class="detail-container" id="productDetailView">
        <!-- Injected Dynamically via script.js -->
    </div>

    <footer>
        <p>&copy; 2026 FarmDirect. Empowering Agriculture with Direct Peer-to-Peer Trading.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof renderProductPage === 'function') {
                renderProductPage();
            }
        });
    </script>
</body>
</html>
